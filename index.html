<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>防衛戦線 ネオンシューター</title>
    <style>
        /* 全体のスタイル設定 */
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            /* タイトル画面の背景設定 */
            background-image: url('https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%AA.png?raw=true');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 1.5s ease-in-out; /* 背景の切り替えを滑らかにフェード */
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            touch-action: none; /* スマホでのスクロールを防止 */
        }

        /* パネルレイアウト */
        #appWrapper {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
            height: 100vh;
            box-sizing: border-box;
            background: rgba(0, 0, 0, 0.4); /* 背景を見やすくするためのフィルター */
        }
        
        /* ゲームキャンバスのスタイル */
        #gameContainer {
            grid-column: 2;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #000;
            cursor: crosshair;
        }

        #uiPanel {
            grid-column: 3;
            justify-self: start;
            margin-left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 220px;
        }

        /* 左側メニューパネル */
        #leftMenuPanel {
            grid-column: 1;
            justify-self: end;
            margin-right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 180px;
        }

        /* メニューのボタンスタイル */
        .menu-btn {
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.5);
            color: #0ff;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
            transition: all 0.2s;
            text-align: center;
        }
        
        .menu-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* 画面が狭い場合（スマホなど）のレイアウト */
        @media (max-width: 800px) {
            body {
                overflow: auto;
                touch-action: auto;
            }
            #appWrapper {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                align-items: center;
                height: auto;
                padding: 20px;
                gap: 20px;
            }
            #uiPanel {
                margin-left: 0;
            }
            #leftMenuPanel {
                margin-right: 0;
                width: 100%;
                max-width: 220px;
            }
        }

        /* スコア表示 */
        #uiLayer {
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
            text-shadow: 1px 1px 2px #000;
            display: none;
        }

        .score-text {
            font-size: 20px;
            font-weight: bold;
            color: #0ff;
            margin-bottom: 5px;
        }

        /* 防衛ライン表示のスタイル */
        .defense-text {
            font-size: 16px;
            font-weight: bold;
            color: #ff4444;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        /* ステータス表示のスタイル */
        #statusDisplay {
            margin-top: 15px;
            font-size: 14px;
            color: #ddd;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            line-height: 1.6;
            font-family: monospace;
        }
        .status-max {
            color: #ffaa00;
            font-weight: bold;
        }
        .status-active {
            color: #00ff00;
            font-weight: bold;
        }

        /* 音量コントロールのスタイル */
        #volumeControl {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(0, 10, 20, 0.8);
            border: 1px solid rgba(0, 255, 255, 0.3);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.1);
        }

        #volumeSlider {
            width: 120px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="appWrapper">
    <!-- 左側メニューパネル -->
    <div id="leftMenuPanel">
        <button id="backToTitleBtn" class="menu-btn" style="display: none;">タイトルへ戻る</button>
    </div>

    <!-- ゲームキャンバス -->
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>
    
    <!-- 右側UIパネル -->
    <div id="uiPanel">
        <!-- 音量調整スライダー -->
        <div id="volumeControl">
            <span style="font-size: 18px;">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5">
        </div>

        <!-- UIレイヤー -->
        <div id="uiLayer">
            <div class="score-text" id="stageDisplay" style="color: #fff;">STAGE: 1</div>
            <div class="score-text" id="scoreDisplay">スコア: 0</div>
            <div class="defense-text" id="defenseDisplay">防衛ライン: ♥♥♥♥♥</div>
            <div id="statusDisplay"></div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const stageDisplay = document.getElementById('stageDisplay');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const defenseDisplay = document.getElementById('defenseDisplay');
    const statusDisplay = document.getElementById('statusDisplay');
    const volumeSlider = document.getElementById('volumeSlider');
    const uiLayer = document.getElementById('uiLayer');
    const backToTitleBtn = document.getElementById('backToTitleBtn');

    // ゲームの状態管理
    let gameState = 'INIT'; // 'INIT', 'START', 'PLAYING', 'GAMEOVER'
    let score = 0;
    let frameCount = 0;
    let level = 1;

    const maxDefenseHp = 5;
    let defenseHp = maxDefenseHp;
    let damageEffectTimer = 0;
    let isDefenseLineActive = true;
    let isDeveloperMode = false;
    const RUSH_INTERVAL = 1200; 
    const RUSH_DURATION = 300;  
    let rushTimeLeft = 0;

    // 音声の読み込み
    const titleBgm = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/8-bit_Stage1.mp3');
    titleBgm.loop = true;
    titleBgm.volume = parseFloat(volumeSlider.value);
    const mainBgm = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/8-bit_Aggressive1.mp3');
    mainBgm.loop = true;
    mainBgm.volume = parseFloat(volumeSlider.value) * 0.5;
    const shotSe = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E3%82%B7%E3%83%A7%E3%83%83%E3%83%88.mp3');
    const missileSe = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E3%83%9F%E3%82%B5%E3%82%A4%E3%83%AB.mp3');
    const itemSe = new Audio('https://raw.githubusercontent.com/GlanzaV8/Unigames/main/%E3%82%B9%E3%83%86%E3%83%BC%E3%82%BF%E3%82%B9%E6%B2%BB%E7%99%821.mp3');

    volumeSlider.addEventListener('input', (e) => {
        titleBgm.volume = parseFloat(e.target.value);
        mainBgm.volume = parseFloat(e.target.value) * 0.5;
    });

    // 画面外の背景画像リスト（ステージ進行ごとに切り替え）
    const externalBackgrounds = [
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A0.png?raw=true', // ステージ1用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A1.png?raw=true', // ステージ2用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A2.png?raw=true', // ステージ3用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A3.png?raw=true', // ステージ4用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A4.png?raw=true', // ステージ5用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A5.png?raw=true', // ステージ6用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A6.png?raw=true', // ステージ7用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A7.png?raw=true', // ステージ8用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A8.png?raw=true', // ステージ9用
        'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%A9.png?raw=true'  // ステージ10用
    ];

    // ★画像ロード遅延による背景非表示を防ぐため、事前に全背景画像を読み込んでキャッシュしておく処理を追加
    externalBackgrounds.forEach(src => {
        const img = new Image();
        img.src = src;
    });

    // 自機画像の読み込み
    const playerImg = new Image();
    let isPlayerImgLoaded = false;
    playerImg.onload = () => { isPlayerImgLoaded = true; };
    playerImg.src = 'https://github.com/GlanzaV8/Unigames/blob/main/%E5%AE%87%E5%AE%99%E8%88%B9.png?raw=true';

    // タイトル画面専用（キャンバス内）背景画像の読み込み
    const titleBgImg = new Image();
    let isTitleBgLoaded = false;
    titleBgImg.onload = () => { isTitleBgLoaded = true; };
    titleBgImg.src = 'https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%AA.png?raw=true';

    // 中ボス画像の読み込み
    const midBossImg = new Image();
    let isMidBossImgLoaded = false;
    midBossImg.onload = () => { isMidBossImgLoaded = true; };
    midBossImg.src = 'https://github.com/GlanzaV8/Unigames/blob/main/%E4%B8%AD%E3%83%9C%E3%82%B9.png?raw=true';

    // BIG BOSS（大ボス）画像の読み込み
    const bigBossImg = new Image();
    let isBigBossImgLoaded = false;
    bigBossImg.onload = () => { isBigBossImgLoaded = true; };
    bigBossImg.src = 'https://github.com/GlanzaV8/Unigames/blob/main/%E3%83%9C%E3%82%B9.png?raw=true';

    let stars = [];
    let bullets = [];
    let missiles = [];
    let enemies = [];
    let enemyBullets = [];
    let particles = [];
    let items = [];
    let floatingTexts = [];
    let bgElements = []; 
    
    // 派手な演出用の変数
    let shockwaves = [];
    let itemFlashTimer = 0;
    let itemFlashColor = '#ffffff';

    let currentStage = 1;
    let targetScoreForBoss = 500;
    let boss = null;
    let stageMessageText = "";
    let stageMessageTimer = 0;
    let stageMessageColor = "#00ffff";

    const stageBackgrounds = [
        { top: '#003366', bottom: '#001133', starColor: '#aaddff', effect: 'sea', name: '海上フロント' },
        { top: '#002200', bottom: '#004411', starColor: '#aaffaa', effect: 'forest', name: '密林地帯' },
        { top: '#aa6622', bottom: '#442200', starColor: '#ffcc88', effect: 'desert', name: '灼熱の砂漠' },
        { top: '#110022', bottom: '#220044', starColor: '#ffffaa', effect: 'city', name: '眠らない都市' },
        { top: '#440000', bottom: '#110000', starColor: '#ff4400', effect: 'volcano', name: '活火山地帯' },
        { top: '#88bbff', bottom: '#eeffff', starColor: '#ffffff', effect: 'snow', name: '極寒の氷雪' },
        { top: '#2266aa', bottom: '#66aaff', starColor: '#ffffff', effect: 'cloud', name: '成層圏' },
        { top: '#001100', bottom: '#003311', starColor: '#aaffaa', cyber: true, effect: 'cyber', name: '電脳空間' },
        { top: '#1a0033', bottom: '#330066', starColor: '#ddaaff', effect: 'warp', name: '超空間ワープ' },
        { top: '#220000', bottom: '#550000', starColor: '#ffaaaa', boss: true, effect: 'boss', name: '敵要塞深部' },
    ];

    let targetX = canvas.width / 2;
    let targetY = canvas.height - 100;

    const player = {
        x: canvas.width / 2, y: canvas.height - 100, radius: 15, color: '#00ffff',
        fireRate: 15, baseFireRate: 15, speedBoostTimer: 0, lastFire: 0,
        powerLevel: 1, missileLevel: 0, lastMissileFire: 0, hasShield: false
    };

    function updatePointerInfo(e) {
        const rect = canvas.getBoundingClientRect();
        let clientX = e.clientX, clientY = e.clientY;
        if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY;
        }
        targetX = clientX - rect.left;
        targetY = clientY - rect.top;
    }

    canvas.addEventListener('mousemove', updatePointerInfo);
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updatePointerInfo(e); }, {passive: false});

    backToTitleBtn.addEventListener('click', () => {
        if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
            gameState = 'START';
            uiLayer.style.display = 'none';
            backToTitleBtn.style.display = 'none'; 
            mainBgm.pause(); mainBgm.currentTime = 0;
            titleBgm.play().catch(() => {});
            // タイトル画面に戻った時は、再び画面外背景を⑪（宇宙都市）にする
            document.body.style.backgroundImage = "url('https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%AA.png?raw=true')";
        }
    });

    function startGame(e) {
        titleBgm.pause(); titleBgm.currentTime = 0;
        mainBgm.currentTime = 0; mainBgm.play().catch(() => {});
        resetGame();
        gameState = 'PLAYING';
        uiLayer.style.display = 'block';
        backToTitleBtn.style.display = 'block';
        updateStatusDisplay();
        
        // ★ゲーム開始時（ステージ1）は画面外背景を①にする
        document.body.style.backgroundImage = `url('${externalBackgrounds[0]}')`;
        
        if(e) updatePointerInfo(e);
    }

    function handleInteract(e) {
        if (gameState === 'INIT') {
            gameState = 'START';
            titleBgm.play().catch(() => {});
            return;
        }
        const rect = canvas.getBoundingClientRect();
        let clientX = e ? e.clientX : 0, clientY = e ? e.clientY : 0;
        if (e && e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
        } else if (e && e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY;
        }
        let clickX = clientX - rect.left, clickY = clientY - rect.top;

        if (gameState === 'START') {
            let btnX = canvas.width / 2 - 100, btnW = 200, btnH = 40;
            let btn1Y = canvas.height / 2 + 10, btn2Y = canvas.height / 2 + 60;
            if (clickX >= btnX && clickX <= btnX + btnW && clickY >= btn1Y && clickY <= btn1Y + btnH) {
                isDefenseLineActive = true; isDeveloperMode = false; startGame(e);
            } else if (clickX >= btnX && clickX <= btnX + btnW && clickY >= btn2Y && clickY <= btn2Y + btnH) {
                isDefenseLineActive = true; isDeveloperMode = true; startGame(e);
            }
        } else if (gameState === 'GAMEOVER') {
            let btnX = canvas.width / 2 - 80, btnW = 160, btnH = 40;
            if (clickX >= btnX && clickX <= btnX + btnW && clickY >= canvas.height/2+40 && clickY <= canvas.height/2+80) {
                startGame(e);
            } else if (clickX >= btnX && clickX <= btnX + btnW && clickY >= canvas.height/2+100 && clickY <= canvas.height/2+140) {
                gameState = 'START'; uiLayer.style.display = 'none'; backToTitleBtn.style.display = 'none';
                titleBgm.play().catch(() => {});
                // タイトル画面に戻った時は、画面外背景を⑪（宇宙都市）にする
                document.body.style.backgroundImage = "url('https://github.com/GlanzaV8/Unigames/blob/main/%E8%83%8C%E6%99%AF%E2%91%AA.png?raw=true')";
            }
        }
    }
    
    canvas.addEventListener('mousedown', handleInteract);
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteract(e); }, {passive: false});

    function updateDefenseDisplay() {
        if (!isDefenseLineActive) { defenseDisplay.style.display = 'none'; return; }
        defenseDisplay.style.display = 'block';
        defenseDisplay.innerText = `防衛ライン: ${'♥'.repeat(defenseHp) + '♡'.repeat(maxDefenseHp - defenseHp)}`;
        defenseDisplay.style.color = defenseHp <= 1 ? '#ff0000' : '#ff4444';
        defenseDisplay.style.textShadow = defenseHp <= 1 ? '0 0 5px #ff0000' : 'none';
    }

    function updateStatusDisplay() {
        let shotText = player.powerLevel >= 4 ? `<span class="status-max">SHOT   : MAX</span>` : `SHOT   : LV${player.powerLevel}`;
        let missileText = player.missileLevel >= 3 ? `<span class="status-max">MISSILE: MAX</span>` : `MISSILE: ${player.missileLevel === 0 ? 'OFF' : 'LV' + player.missileLevel}`;
        let speedText = player.speedBoostTimer > 0 ? `<span class="status-active">SPEED  : UP (${(player.speedBoostTimer/60).toFixed(1)}s)</span>` : `SPEED  : NORMAL`;
        let shieldText = `SHIELD : ${player.hasShield ? '<span class="status-active">ON</span>' : 'OFF'}` + (isDeveloperMode ? ' <span style="color:#f0f">[DEV: INVINCIBLE]</span>' : '');
        statusDisplay.innerHTML = `${shotText}<br>${missileText}<br>${speedText}<br>${shieldText}`;
    }

    function initBgElements(effect) {
        bgElements = [];
        if (effect === 'cloud' || effect === 'snow') {
            for(let i=0; i<10; i++) bgElements.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, radius: 80+Math.random()*120, colorStr: '255, 255, 255', alpha: 0.05+Math.random()*0.1, vy: 0.5+Math.random()*1.0});
        } else if (effect === 'sea') {
            for(let i=0; i<8; i++) bgElements.push({x: 0, y: (canvas.height/8)*i+Math.random()*50, amp: 10+Math.random()*15, freq: 0.01+Math.random()*0.02, phase: Math.random()*Math.PI*2, vy: 0.8+Math.random()*0.5, color: `rgba(20, 80, 150, ${0.3+(i/8)*0.4})`});
        } else if (effect === 'forest') {
            for(let i=0; i<25; i++) bgElements.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, radius: 40+Math.random()*60, r: 10+Math.floor(Math.random()*20), g: 40+Math.floor(Math.random()*40), b: 20+Math.floor(Math.random()*20), vy: 2+Math.random()*3});
        } else if (effect === 'city') {
            for(let i=0; i<25; i++) {
                let w = 40+Math.random()*80, h = 150+Math.random()*400, windows = [];
                for(let wy=10; wy<h-10; wy+=20) for(let wx=5; wx<w-15; wx+=15) if(Math.random()>0.5) windows.push({x:wx, y:wy, light: Math.random()});
                bgElements.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, width: w, height: h, windows: windows, baseColor: 10+Math.random()*20, vy: 1.5+Math.random()*2});
            }
        } else if (effect === 'desert') {
             for(let i=0; i<6; i++) bgElements.push({x: -100+Math.random()*canvas.width, y: (canvas.height/5)*i, ctrlX: Math.random()*canvas.width, ctrlY: -100+Math.random()*200, vy: 1.0+Math.random()*1.5, color: `rgba(${180+Math.random()*40}, ${120+Math.random()*30}, 50, ${0.4+(i/6)*0.4})`});
        } else if (effect === 'volcano' || effect === 'asteroid') {
            for(let i=0; i<10; i++) {
                let vertices = [], baseR = 15+Math.random()*40;
                for(let j=0; j<7; j++) vertices.push(baseR*(0.7+Math.random()*0.4));
                let isVol = effect === 'volcano';
                bgElements.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, vertices: vertices, r: isVol?80+Math.random()*40:60+Math.random()*40, g: isVol?20+Math.random()*20:50+Math.random()*30, b: isVol?10:50+Math.random()*30, vy: 2.0+Math.random()*3.0, rot: Math.random()*Math.PI*2, vRot: (Math.random()-0.5)*0.04, isVolcano: isVol});
            }
        }
    }

    function createExplosion(x, y, color) {
        for (let i = 0; i < 20; i++) {
            let angle = Math.random() * Math.PI * 2, speed = Math.random() * 7 + 2;
            particles.push({x: x, y: y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, life: 1.0, decay: Math.random()*0.03+0.02, color: color, size: Math.random()*3+1.5, type: 'spark'});
        }
        for (let i = 0; i < 10; i++) {
            particles.push({x: x+(Math.random()-0.5)*15, y: y+(Math.random()-0.5)*15, vx: (Math.random()-0.5)*1.5, vy: (Math.random()-0.5)*1.5-0.5, life: 1.0, decay: Math.random()*0.02+0.01, color: `rgba(50, 50, 50, 0.6)`, size: Math.random()*10+5, type: 'smoke'});
        }
    }

    function createItemSparkle(x, y, color) {
        for (let i = 0; i < 40; i++) {
            let angle = Math.random() * Math.PI * 2, speed = Math.random() * 8 + 4;

    function createFloatingText(x, y, text, color, size = 16) {

    }

    function resetGame() {

    }

    function update() {
        if (gameState !== 'PLAYING') return;
        frameCount++; level = 1 + Math.floor(currentStage / 2);

        if (damageEffectTimer > 0) damageEffectTimer--;
        if (stageMessageTimer > 0) stageMessageTimer--;
        if (itemFlashTimer > 0) itemFlashTimer--; 

        if (player.speedBoostTimer > 0) {
            player.speedBoostTimer--;
            if (player.speedBoostTimer <= 0) player.fireRate = player.baseFireRate;
        }
        if (isDeveloperMode) player.fireRate = 3;

        player.x += (targetX - player.x) * 0.3; player.y += (targetY - player.y) * 0.3;
        player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
        player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

        // 射撃
        if (frameCount - player.lastFire >= player.fireRate) {
            let spd = -15, c = '#ffff00';
            let se = shotSe.cloneNode(); se.volume = volumeSlider.value * 0.4; se.play().catch(()=>{});
            if (player.powerLevel === 1) { bullets.push({x: player.x, y: player.y-player.radius, vy: spd, vx: 0, radius: 4, color: c}); }
            else if (player.powerLevel === 2) { bullets.push({x: player.x-10, y: player.y-player.radius, vy: spd, vx: 0, radius: 4, color: c}); bullets.push({x: player.x+10, y: player.y-player.radius, vy: spd, vx: 0, radius: 4, color: c}); }
            else if (player.powerLevel === 3) { bullets.push({x: player.x, y: player.y-player.radius, vy: spd, vx: 0, radius: 5, color: '#ffaa00'}); bullets.push({x: player.x-12, y: player.y-player.radius, vy: spd, vx: -2, radius: 4, color: c}); bullets.push({x: player.x+12, y: player.y-player.radius, vy: spd, vx: 2, radius: 4, color: c}); }
            else { bullets.push({x: player.x, y: player.y-player.radius, vy: spd, vx: 0, radius: 5, color: '#ff5500'}); bullets.push({x: player.x-10, y: player.y-player.radius, vy: spd, vx: -2, radius: 4, color: '#ffaa00'}); bullets.push({x: player.x+10, y: player.y-player.radius, vy: spd, vx: 2, radius: 4, color: '#ffaa00'}); bullets.push({x: player.x-20, y: player.y-player.radius, vy: spd, vx: -4, radius: 3, color: c}); bullets.push({x: player.x+20, y: player.y-player.radius, vy: spd, vx: 4, radius: 3, color: c}); }
            player.lastFire = frameCount;
        }

        if (player.missileLevel > 0 && frameCount - player.lastMissileFire >= player.baseFireRate * 4) {
            let mSpd = 8;
            let mSe = missileSe.cloneNode(); mSe.volume = volumeSlider.value * 0.5; mSe.play().catch(()=>{});
            if (player.missileLevel >= 1) { missiles.push({x: player.x-15, y: player.y, vx: -2, vy: -mSpd, radius: 4}); missiles.push({x: player.x+15, y: player.y, vx: 2, vy: -mSpd, radius: 4}); }
            if (player.missileLevel >= 2) { missiles.push({x: player.x-25, y: player.y, vx: -4, vy: -mSpd+1, radius: 4}); missiles.push({x: player.x+25, y: player.y, vx: 4, vy: -mSpd+1, radius: 4}); }
            if (player.missileLevel >= 3) { missiles.push({x: player.x-35, y: player.y, vx: -6, vy: -mSpd+2, radius: 4}); missiles.push({x: player.x+35, y: player.y, vx: 6, vy: -mSpd+2, radius: 4}); }
            player.lastMissileFire = frameCount;
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            bullets[i].y += bullets[i].vy; bullets[i].x += bullets[i].vx;
            if (bullets[i].y < -10 || bullets[i].x < -10 || bullets[i].x > canvas.width + 10) bullets.splice(i, 1);
        }

        for (let i = missiles.length - 1; i >= 0; i--) {
            let m = missiles[i], target = null, minDist = 300;
            for (let j = 0; j < enemies.length; j++) {
                if (enemies[j].y > 0) { let d = Math.hypot(enemies[j].x - m.x, enemies[j].y - m.y); if (d < minDist) { minDist = d; target = enemies[j]; } }
            }
            if (boss && boss.y > 0) { let d = Math.hypot(boss.x - m.x, boss.y - m.y); if (d < minDist) { minDist = d; target = boss; } }
            if (target) {
                let angle = Math.atan2(target.y - m.y, target.x - m.x);
                m.vx += (Math.cos(angle)*10 - m.vx) * 0.08; m.vy += (Math.sin(angle)*10 - m.vy) * 0.08;
            }
            if (frameCount % 2 === 0) particles.push({x: m.x, y: m.y, vx: 0, vy: 1, life: 0.5, color: '#aaa'});
            m.x += m.vx; m.y += m.vy;
            if (m.y < -50 || m.x < -50 || m.x > canvas.width + 50 || m.y > canvas.height + 50) missiles.splice(i, 1);
        }

        if (frameCount > 0 && frameCount % RUSH_INTERVAL === 0) rushTimeLeft = RUSH_DURATION;
        if (rushTimeLeft > 0) rushTimeLeft--;

        let baseSpawnRate = Math.max(15, 60 - currentStage * 4);
        if (boss) baseSpawnRate *= 3;
        let spawnRate = rushTimeLeft > 0 ? Math.max(5, Math.floor(baseSpawnRate / 3)) : baseSpawnRate;

        if (frameCount % spawnRate === 0) {
            let size = Math.random()*10 + 15, speed = Math.random()*2 + 2 + (currentStage*0.2), hp = 1 + Math.floor(currentStage/3);
            let type = 'normal', color = '#ff0044', canShoot = false, shootInterval = 0;
            let rand = Math.random(), orangeChance = Math.min(0.4, 0.1+currentStage*0.05), sineChance = Math.min(0.3, 0.05+currentStage*0.03), shooterChance = Math.min(0.3, currentStage>=4 ? 0.05+(currentStage-4)*0.05 : 0);

            if (rand < shooterChance) { type = 'shooter'; color = '#00ffaa'; hp = 2+Math.floor(currentStage/4); speed *= 0.8; canShoot = true; shootInterval = Math.max(60, 150-currentStage*5); }
            else if (rand < shooterChance + sineChance) { type = 'sine'; color = '#ff00ff'; hp = 2+Math.floor(currentStage/4); speed *= 1.2; }
            else if (rand < shooterChance + sineChance + orangeChance) { type = 'heavy'; color = '#ff8800'; size = 25; hp = 3+Math.floor(currentStage/1.5); }
            enemies.push({x: Math.random()*(canvas.width-size*2)+size, y: -size, radius: size, vy: speed, hp: hp, type: type, color: color, initialX: 0, canShoot: canShoot, shootTimer: 0, shootInterval: shootInterval});
            enemies[enemies.length-1].initialX = enemies[enemies.length-1].x;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            if (e.type === 'sine') e.x = e.initialX + Math.sin(frameCount * 0.05) * 50;
            e.y += e.vy;

            if (e.canShoot && e.y > 0 && e.y < canvas.height - 100) {
                e.shootTimer++;
                if (e.shootTimer >= e.shootInterval) {
                    e.shootTimer = 0;
                    let angle = Math.atan2(player.y - e.y, player.x - e.x), bSpeed = 3 + currentStage * 0.1;
                    enemyBullets.push({x: e.x, y: e.y, vx: Math.cos(angle)*bSpeed, vy: Math.sin(angle)*bSpeed, radius: 4, color: '#00ffaa'});

                }

            if (e.y - e.radius > canvas.height) {
                if (isDefenseLineActive) {

                    updateDefenseDisplay(); damageEffectTimer = 15;
                    createExplosion(e.x, canvas.height, '#ff0000'); createFloatingText(e.x, canvas.height - 20, "BREACHED!", "#ff0000", 20); 
                    enemies.splice(i, 1);

            }

            let isDead = false;
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + b.radius) {
                    e.hp--; createExplosion(b.x, b.y, '#ffff00'); bullets.splice(j, 1);
                    if (e.hp <= 0) {
                        score += (e.type === 'normal' ? 10 : 30); scoreDisplay.innerText = `スコア: ${score}`;
                        createExplosion(e.x, e.y, e.color);
                        if (Math.random() < (e.type === 'normal' ? 0.08 : 0.25)) {
                            let rand = Math.random(), iType = rand<0.3?'power':rand<0.55?'speed':rand<0.8?'missile':'shield', iColor = iType==='power'?'#ff3333':iType==='speed'?'#3388ff':iType==='missile'?'#ff8800':'#33ff33', iLabel = iType==='power'?'P':iType==='speed'?'S':iType==='missile'?'M':'D';
                            items.push({ x: e.x, y: e.y, radius: 12, vy: 2, type: iType, color: iColor, label: iLabel });
                        }
                        enemies.splice(i, 1); isDead = true; break;
                    }
                }
            }
            if (isDead) continue;

            for (let j = missiles.length - 1; j >= 0; j--) {
                let m = missiles[j];
                if (Math.hypot(e.x - m.x, e.y - m.y) < e.radius + m.radius) {
                    e.hp -= 2; createExplosion(m.x, m.y, '#ff8800'); missiles.splice(j, 1);
                    if (e.hp <= 0) {
                        score += (e.type === 'normal' ? 10 : 30); scoreDisplay.innerText = `スコア: ${score}`;
                        createExplosion(e.x, e.y, e.color);
                        if (Math.random() < (e.type === 'normal' ? 0.08 : 0.25)) {
                            let rand = Math.random(), iType = rand<0.3?'power':rand<0.55?'speed':rand<0.8?'missile':'shield', iColor = iType==='power'?'#ff3333':iType==='speed'?'#3388ff':iType==='missile'?'#ff8800':'#33ff33', iLabel = iType==='power'?'P':iType==='speed'?'S':iType==='missile'?'M':'D';
                            items.push({ x: e.x, y: e.y, radius: 12, vy: 2, type: iType, color: iColor, label: iLabel });
                        }
                        enemies.splice(i, 1); break;
                    }
                }
            }
            
            if (Math.hypot(player.x - e.x, player.y - e.y) < player.radius * 0.6 + e.radius * 0.8) {
                if (player.hasShield) {
                    if (!isDeveloperMode) player.hasShield = false;
                    createExplosion(e.x, e.y, e.color); createExplosion(player.x, player.y, '#00ff00');
                    enemies.splice(i, 1);
                } else {
                    if (isDeveloperMode) { createExplosion(e.x, e.y, e.color); createExplosion(player.x, player.y, '#00ffff'); enemies.splice(i, 1); } 
                    else { createExplosion(player.x, player.y, '#00ffff'); gameState = 'GAMEOVER'; mainBgm.pause(); }
                }
            }
        }

        if (score >= targetScoreForBoss && !boss) {
            let isBigBoss = (currentStage % 10 === 0);
            boss = { x: canvas.width/2, y: -60, radius: isBigBoss?45:30, hp: isBigBoss?150+(currentStage*10):50+(currentStage*5), maxHp: isBigBoss?150+(currentStage*10):50+(currentStage*5), color: isBigBoss?'#ff1111':'#ffaa00', vx: isBigBoss?1.5+(currentStage*0.05):2.5+(currentStage*0.1), vy: 1, attackTimer: 0, isBigBoss: isBigBoss };
            rushTimeLeft = 0; stageMessageText = isBigBoss ? "WARNING: BIG BOSS!" : "WARNING: SUB BOSS!";
            stageMessageTimer = 90; stageMessageColor = "#ff0000";
        }

        if (boss) {
            if (boss.y < 100) boss.y += boss.vy;
            else { boss.x += boss.vx; if (boss.x < boss.radius || boss.x > canvas.width - boss.radius) boss.vx *= -1; }

            boss.attackTimer++;
            if (boss.attackTimer % (boss.isBigBoss ? 60 : 80) === 0) {
                let angle = Math.atan2(player.y - boss.y, player.x - boss.x), speed = 4 + (currentStage * 0.1); 
                if (boss.isBigBoss) {
                    enemyBullets.push({x: boss.x, y: boss.y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, radius: 6, color: '#ff00ff'});
                    enemyBullets.push({x: boss.x, y: boss.y, vx: Math.cos(angle-0.4)*speed, vy: Math.sin(angle-0.4)*speed, radius: 6, color: '#ff00ff'});
                    enemyBullets.push({x: boss.x, y: boss.y, vx: Math.cos(angle+0.4)*speed, vy: Math.sin(angle+0.4)*speed, radius: 6, color: '#ff00ff'});
                } else {
                    enemyBullets.push({x: boss.x, y: boss.y, vx: Math.cos(angle-0.2)*speed, vy: Math.sin(angle-0.2)*speed, radius: 5, color: '#ffff00'});
                    enemyBullets.push({x: boss.x, y: boss.y, vx: Math.cos(angle+0.2)*speed, vy: Math.sin(angle+0.2)*speed, radius: 5, color: '#ffff00'});
                }
                let se = shotSe.cloneNode(); se.volume = volumeSlider.value * 0.3; se.play().catch(()=>{});
            }

            for (let j = bullets.length - 1; j >= 0; j--) {
                if (Math.hypot(boss.x - bullets[j].x, boss.y - bullets[j].y) < boss.radius + bullets[j].radius) { boss.hp--; createExplosion(bullets[j].x, bullets[j].y, '#ffff00'); bullets.splice(j, 1); }
            }
            for (let j = missiles.length - 1; j >= 0; j--) {
                if (Math.hypot(boss.x - missiles[j].x, boss.y - missiles[j].y) < boss.radius + missiles[j].radius) { boss.hp -= 2; createExplosion(missiles[j].x, missiles[j].y, '#ff8800'); missiles.splice(j, 1); }
            }
            if (Math.hypot(player.x - boss.x, player.y - boss.y) < player.radius * 0.6 + boss.radius * 0.8) {
                if (player.hasShield) { if (!isDeveloperMode) player.hasShield = false; createExplosion(boss.x, boss.y, '#00ff00'); createExplosion(player.x, player.y, '#00ff00'); boss.hp -= 10; }
                else if (!isDeveloperMode) { createExplosion(player.x, player.y, '#00ffff'); gameState = 'GAMEOVER'; mainBgm.pause(); }
            }

            if (boss.hp <= 0) {
                score += boss.isBigBoss ? 1000 : 300;
                for(let k = 0; k < (boss.isBigBoss ? 20 : 10); k++) createExplosion(boss.x + (Math.random()-0.5)*80, boss.y + (Math.random()-0.5)*80, '#ff0000');
                
                let dropTypes = ['power', 'speed', 'missile', 'shield'];
                for(let k = 0; k < (boss.isBigBoss ? 5 : 2); k++) {
                    let type = dropTypes[Math.floor(Math.random() * dropTypes.length)];
                    let color = type==='power'?'#ff3333':type==='speed'?'#3388ff':type==='missile'?'#ff8800':'#33ff33';
                    let label = type==='power'?'P':type==='speed'?'S':type==='missile'?'M':'D';
                    items.push({ x: boss.x, y: boss.y, radius: 12, vx: (Math.random()-0.5)*6, vy: -3+Math.random()*2, type: type, color: color, label: label });
                }
                boss = null; currentStage++; targetScoreForBoss = score + 500;
                
                let nextBgConfig = stageBackgrounds[(currentStage - 1) % 10];
                initBgElements(nextBgConfig.effect);
                stageMessageText = `STAGE ${currentStage} : ${nextBgConfig.name}`;
                stageMessageTimer = 120; stageMessageColor = "#00ffff";
                stageDisplay.innerText = `STAGE: ${currentStage}`; scoreDisplay.innerText = `スコア: ${score}`;
                
                // ★ステージクリアに合わせて、画面外の背景もループして切り替える
                let externalBgUrl = externalBackgrounds[(currentStage - 1) % externalBackgrounds.length];
                document.body.style.backgroundImage = `url('${externalBgUrl}')`;
            }
        }

        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let b = enemyBullets[i]; b.x += b.vx; b.y += b.vy;
            if (b.y > canvas.height + 10 || b.x < -10 || b.x > canvas.width + 10 || b.y < -10) { enemyBullets.splice(i, 1); continue; }
            if (Math.hypot(player.x - b.x, player.y - b.y) < player.radius * 0.5 + b.radius) {
                if (player.hasShield) { if (!isDeveloperMode) player.hasShield = false; createExplosion(b.x, b.y, '#00ff00'); enemyBullets.splice(i, 1); }
                else if (!isDeveloperMode) { createExplosion(player.x, player.y, '#00ffff'); gameState = 'GAMEOVER'; mainBgm.pause(); }
                else { createExplosion(b.x, b.y, '#00ffff'); enemyBullets.splice(i, 1); }
            }
        }

        for (let i = items.length - 1; i >= 0; i--) {
            let item = items[i]; item.x += (item.vx || 0); item.y += (item.vy > 0 ? item.vy : item.vy += 0.1);
            if (item.y - item.radius > canvas.height) { items.splice(i, 1); continue; }

            if (Math.hypot(player.x - item.x, player.y - item.y) < player.radius + item.radius) {
                let iSe = itemSe.cloneNode(); iSe.volume = volumeSlider.value * 0.6; iSe.play().catch(() => {});

                if (item.type === 'power') {
                    if (player.powerLevel < 4) { player.powerLevel++; createFloatingText(item.x, item.y, "POWER UP!", item.color, 24); } 
                    else { score += 100; createFloatingText(item.x, item.y, "MAX POWER! +100", item.color, 24); }
                } else if (item.type === 'speed') {
                    if (player.speedBoostTimer > 0) { score += 100; player.speedBoostTimer += 600; createFloatingText(item.x, item.y, "TIME EXTEND! +100", item.color, 24); } 
                    else { player.speedBoostTimer = 600; createFloatingText(item.x, item.y, "SPEED UP!", item.color, 24); }
                    player.fireRate = 3;
                } else if (item.type === 'missile') {
                    if (player.missileLevel < 3) { player.missileLevel++; createFloatingText(item.x, item.y, "MISSILE LOADED!", item.color, 24); } 
                    else { score += 100; createFloatingText(item.x, item.y, "MAX MISSILE! +100", item.color, 24); }
                } else if (item.type === 'shield') {
                    if (player.hasShield) { score += 100; createFloatingText(item.x, item.y, "SHIELD RECHARGED! +100", item.color, 24); } 
                    else { createFloatingText(item.x, item.y, "SHIELD ON!", item.color, 24); }

                shockwaves.push({x: item.x, y: item.y, radius: 10, maxRadius: 180, color: item.color, alpha: 1.0});
                itemFlashTimer = 8; itemFlashColor = item.color;
                createItemSparkle(item.x, item.y, item.color);
                items.splice(i, 1);
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy;
            if (p.type === 'spark') { p.vx *= 0.92; p.vy *= 0.92; } 
            else if (p.type === 'item-spark') { p.vx *= 0.95; p.vy *= 0.95; } 
            else if (p.type === 'smoke') { p.size += 0.2; }
            p.life -= p.decay; if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i]; ft.y += ft.vy; ft.life -= 0.02; if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        for (let i = shockwaves.length - 1; i >= 0; i--) {
            let sw = shockwaves[i]; sw.radius += 12; sw.alpha -= 0.05;
            if (sw.alpha <= 0 || sw.radius >= sw.maxRadius) shockwaves.splice(i, 1);
        }

        let bgIndex = (currentStage - 1) % 10, bgConfig = stageBackgrounds[bgIndex];
        let starSpeedMult = bgConfig.boss ? 3 : 1, effect = bgConfig.effect;

        stars.forEach(star => {
            if (effect === 'volcano') { star.y -= star.speed * starSpeedMult; star.x += Math.sin(frameCount * 0.1 + star.y) * 1.0; } 
            else { star.y += star.speed * starSpeedMult; }

            if (effect === 'snow') { star.x += Math.sin(frameCount * 0.05 + star.y * 0.01) * 1.5; }

        updateStatusDisplay();
    }

    function draw() {
        if (gameState === 'INIT' || gameState === 'START') {
            if (isTitleBgLoaded) {
                // キャンバス内の背景も宇宙都市にする
                ctx.drawImage(titleBgImg, 0, 0, canvas.width, canvas.height);
                ctx.fillStyle = gameState === 'INIT' ? 'rgba(0, 0, 0, 0.6)' : 'rgba(5, 10, 20, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = gameState === 'INIT' ? '#050510' : 'rgba(5, 10, 20, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        if (gameState === 'PLAYING' || gameState === 'GAMEOVER') {
            let bgIndex = (currentStage - 1) % 10, bgConfig = stageBackgrounds[bgIndex], effect = bgConfig.effect;

            let bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, bgConfig.top); bgGrad.addColorStop(1, bgConfig.bottom);
            ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (bgConfig.cyber) {
                ctx.strokeStyle = 'rgba(0, 255, 0, 0.1)'; ctx.lineWidth = 1; let offset = (frameCount % 40);
                for(let y = offset; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
                for(let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            }

            if (bgConfig.boss && gameState === 'PLAYING') { ctx.fillStyle = `rgba(255, 0, 0, ${Math.sin(frameCount * 0.05) * 0.1})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }

            bgElements.forEach(el => {
                if (effect === 'cloud' || effect === 'snow') {
                    let grad = ctx.createRadialGradient(el.x - el.radius*0.2, el.y - el.radius*0.2, 0, el.x, el.y, el.radius);
                    grad.addColorStop(0, `rgba(${el.colorStr}, ${el.alpha * 2})`); grad.addColorStop(1, `rgba(${el.colorStr}, 0)`);
                    ctx.fillStyle = grad; ctx.fillRect(el.x - el.radius, el.y - el.radius, el.radius * 2, el.radius * 2);
                } else if (effect === 'sea') {
                    ctx.fillStyle = el.color; ctx.beginPath(); ctx.moveTo(0, el.y);
                    for(let x = 0; x <= canvas.width; x += 20) { let y = el.y + Math.sin(x * el.freq + el.phase) * el.amp; ctx.lineTo(x, y); }
                    ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();
                } else if (effect === 'forest') {
                     let grad = ctx.createRadialGradient(el.x - el.radius*0.3, el.y - el.radius*0.3, 0, el.x, el.y, el.radius);
                     grad.addColorStop(0, `rgba(${el.r + 30}, ${el.g + 40}, ${el.b + 10}, 0.9)`); grad.addColorStop(0.7, `rgba(${el.r}, ${el.g}, ${el.b}, 0.8)`); grad.addColorStop(1, `rgba(${Math.max(0, el.r-20)}, ${Math.max(0, el.g-20)}, ${Math.max(0, el.b-10)}, 0)`);
                     ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(el.x, el.y, el.radius, 0, Math.PI * 2); ctx.fill();
                } else if (effect === 'city') {
                    let grad = ctx.createLinearGradient(el.x, el.y, el.x + el.width, el.y);
                    grad.addColorStop(0, `rgba(${el.baseColor}, ${el.baseColor}, ${el.baseColor + 10}, 0.9)`); grad.addColorStop(1, `rgba(${el.baseColor - 5}, ${el.baseColor - 5}, ${el.baseColor}, 0.95)`);
                    ctx.fillStyle = grad; ctx.fillRect(el.x, el.y, el.width, el.height);
                    el.windows.forEach(w => { let alpha = 0.5 + Math.sin(frameCount * 0.05 + w.light * 10) * 0.3; ctx.fillStyle = `rgba(255, 255, 180, ${alpha})`; ctx.fillRect(el.x + w.x, el.y + w.y, 8, 12); });
                } else if (effect === 'desert') {
                    ctx.fillStyle = el.color; ctx.beginPath(); ctx.moveTo(0, el.y + 100); ctx.quadraticCurveTo(el.x + el.ctrlX, el.y + el.ctrlY, canvas.width, el.y + 50); ctx.lineTo(canvas.width, canvas.height); ctx.lineTo(0, canvas.height); ctx.fill();
                } else if (effect === 'volcano' || effect === 'asteroid') {
                    ctx.save(); ctx.translate(el.x, el.y); ctx.rotate(el.rot);
                    let maxR = Math.max(...el.vertices), grad = ctx.createRadialGradient(-maxR*0.2, -maxR*0.2, 0, 0, 0, maxR);
                    grad.addColorStop(0, `rgba(${el.r + 40}, ${el.g + 40}, ${el.b + 40}, 0.9)`); grad.addColorStop(0.8, `rgba(${el.r}, ${el.g}, ${el.b}, 0.9)`); grad.addColorStop(1, `rgba(${Math.max(0, el.r-40)}, ${Math.max(0, el.g-40)}, ${Math.max(0, el.b-40)}, 0.9)`);
                    ctx.fillStyle = grad;
                    if (el.isVolcano) { ctx.shadowColor = '#f00'; ctx.shadowBlur = 15; } else { ctx.shadowColor = '#000'; ctx.shadowBlur = 10; }
                    ctx.beginPath();
                    for(let i = 0; i < el.vertices.length; i++) { let angle = (i * Math.PI * 2) / el.vertices.length, r = el.vertices[i], vx = r * Math.cos(angle), vy = r * Math.sin(angle); if (i === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy); }
                    ctx.closePath(); ctx.fill(); ctx.restore();
                }
            });

            ctx.fillStyle = bgConfig.starColor;
            stars.forEach(star => {
                let speedMult = (effect === 'boss' || effect === 'warp') ? 3 : 1;
                ctx.globalAlpha = Math.min(1.0, (star.speed * speedMult) / 4);
                if (effect === 'warp') { ctx.strokeStyle = bgConfig.starColor; ctx.lineWidth = star.size; ctx.beginPath(); ctx.moveTo(star.x, star.y); ctx.lineTo(star.x, star.y - star.speed * speedMult * 4); ctx.stroke(); } 
                else { ctx.beginPath(); ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2); ctx.fill(); }
            });
            ctx.globalAlpha = 1.0;

            if (damageEffectTimer > 0) { ctx.fillStyle = `rgba(255, 0, 0, ${damageEffectTimer / 30})`; ctx.fillRect(0, 0, canvas.width, canvas.height); }

            if (itemFlashTimer > 0) { ctx.globalAlpha = itemFlashTimer / 20; ctx.fillStyle = itemFlashColor; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.globalAlpha = 1.0; }

            if (stageMessageTimer > 0 && gameState === 'PLAYING') {
                ctx.fillStyle = stageMessageColor; ctx.globalAlpha = Math.min(1, stageMessageTimer / 30); ctx.textAlign = 'center'; ctx.font = 'italic bold 32px "Segoe UI", sans-serif'; ctx.shadowColor = stageMessageColor; ctx.shadowBlur = 15; ctx.fillText(stageMessageText, canvas.width / 2, canvas.height / 3); ctx.globalAlpha = 1.0; ctx.shadowBlur = 0; ctx.textAlign = 'left';
            }

            if (rushTimeLeft > 0 && gameState === 'PLAYING') {
                ctx.fillStyle = `rgba(255, 0, 0, ${Math.sin(frameCount * 0.2) * 0.1})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (rushTimeLeft > RUSH_DURATION - 120) { ctx.fillStyle = `rgba(255, 50, 50, ${Math.abs(Math.sin(frameCount * 0.1))})`; ctx.textAlign = 'center'; ctx.font = 'italic bold 28px "Segoe UI", sans-serif'; ctx.shadowColor = '#f00'; ctx.shadowBlur = 10; ctx.fillText('WARNING: ENEMY RUSH!', canvas.width / 2, canvas.height / 3); ctx.shadowBlur = 0; ctx.textAlign = 'left'; }
            }

            shockwaves.forEach(sw => { ctx.save(); ctx.globalAlpha = Math.max(0, sw.alpha); ctx.strokeStyle = sw.color; ctx.lineWidth = 6 * sw.alpha; ctx.shadowColor = sw.color; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); });

            if (isDefenseLineActive) {
                let lineY = canvas.height - 10;
                ctx.strokeStyle = `rgba(255, 50, 50, ${0.4 + Math.sin(frameCount * 0.1) * 0.3})`; ctx.lineWidth = 3; ctx.shadowColor = '#f00'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.moveTo(0, lineY); ctx.lineTo(canvas.width, lineY); ctx.stroke(); ctx.shadowBlur = 0;
                if (defenseHp <= 1) { ctx.fillStyle = `rgba(255, 0, 0, ${0.1 + Math.sin(frameCount * 0.2) * 0.1})`; ctx.fillRect(0, lineY - 20, canvas.width, 30); }
            }

            particles.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life); ctx.beginPath();
                if (p.type === 'smoke') { ctx.fillStyle = p.color; ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); } 
                else if (p.type === 'item-spark') { ctx.fillStyle = '#ffffff'; ctx.shadowColor = p.color; ctx.shadowBlur = 15; ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; } 
                else { ctx.fillStyle = p.color; ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.shadowColor = p.color; ctx.shadowBlur = 5; ctx.fill(); ctx.shadowBlur = 0; }
            });
            ctx.globalAlpha = 1.0;

            floatingTexts.forEach(ft => {
                ctx.globalAlpha = Math.max(0, ft.life); ctx.fillStyle = ft.color; ctx.textAlign = 'center';
                let popScale = ft.life > 0.8 ? (ft.life - 0.8) * 3 : 0; let currentSize = (ft.size || 16) * (1 + popScale);
                ctx.font = `bold ${currentSize}px "Segoe UI", sans-serif`; ctx.shadowColor = ft.color; ctx.shadowBlur = 10; ctx.fillText(ft.text, ft.x, ft.y);
                ctx.lineWidth = 1; ctx.strokeStyle = '#ffffff'; ctx.strokeText(ft.text, ft.x, ft.y); ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1.0;

            if (boss) {
                if (boss.isBigBoss && isBigBossImgLoaded) {
                    const imgSize = boss.radius * 3.5; 
                    ctx.shadowColor = boss.color; ctx.shadowBlur = 20;
                    ctx.drawImage(bigBossImg, boss.x - imgSize / 2, boss.y - imgSize / 2, imgSize, imgSize);
                    ctx.shadowBlur = 0;
                } else if (!boss.isBigBoss && isMidBossImgLoaded) {
                    const imgSize = boss.radius * 3.0; 
                    ctx.shadowColor = boss.color; ctx.shadowBlur = 20;
                    ctx.drawImage(midBossImg, boss.x - imgSize / 2, boss.y - imgSize / 2, imgSize, imgSize);
                    ctx.shadowBlur = 0;
                } else {
                    ctx.fillStyle = 'rgba(255, 100, 0, 0.8)'; ctx.beginPath(); ctx.moveTo(boss.x - boss.radius*0.5, boss.y - boss.radius*0.8); ctx.lineTo(boss.x + boss.radius*0.5, boss.y - boss.radius*0.8); ctx.lineTo(boss.x, boss.y - boss.radius*1.5 - Math.random() * 20); ctx.fill();
                    let bGrad = ctx.createRadialGradient(boss.x - boss.radius*0.3, boss.y + boss.radius*0.3, boss.radius*0.1, boss.x, boss.y, boss.radius);
                    bGrad.addColorStop(0, '#fff'); bGrad.addColorStop(0.3, boss.color); bGrad.addColorStop(1, '#222');
                    ctx.fillStyle = bGrad; ctx.shadowColor = boss.color; ctx.shadowBlur = 20; ctx.beginPath();
                    let vertices = boss.isBigBoss ? 8 : 4;
                    for (let i = 0; i < vertices; i++) { let angle = (i * Math.PI * 2) / vertices + frameCount * 0.05, x = boss.x + boss.radius * Math.cos(angle), y = boss.y + boss.radius * Math.sin(angle); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
                    ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;
                    let coreGrad = ctx.createRadialGradient(boss.x, boss.y, 0, boss.x, boss.y, boss.radius * 0.4);
                    coreGrad.addColorStop(0, '#fff'); coreGrad.addColorStop(1, 'rgba(0, 255, 255, 0)');
                    ctx.fillStyle = coreGrad; ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.radius * 0.4, 0, Math.PI * 2); ctx.fill();
                }
                
                let hpRatio = Math.max(0, boss.hp / boss.maxHp), barWidth = boss.isBigBoss ? 100 : 60;
                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)'; ctx.fillRect(boss.x - barWidth/2, boss.y - boss.radius - 20, barWidth, 6);
                ctx.fillStyle = '#0f0'; ctx.fillRect(boss.x - barWidth/2, boss.y - boss.radius - 20, barWidth * hpRatio, 6);
            }

            enemyBullets.forEach(b => {
                let bGrad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius);
                bGrad.addColorStop(0, '#fff'); bGrad.addColorStop(0.4, b.color); bGrad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = bGrad; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius * 1.5, 0, Math.PI * 2); ctx.fill();
            });

            bullets.forEach(b => {
                ctx.strokeStyle = b.color; ctx.lineWidth = b.radius * 1.5; ctx.lineCap = 'round'; ctx.shadowColor = b.color; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x, b.y - b.vy * 1.5); ctx.stroke(); ctx.shadowBlur = 0;
            });

            missiles.forEach(m => {
                ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(Math.atan2(m.vy, m.vx) + Math.PI / 2);
                let mGrad = ctx.createLinearGradient(-m.radius, 0, m.radius, 0);
                mGrad.addColorStop(0, '#888'); mGrad.addColorStop(0.5, '#eee'); mGrad.addColorStop(1, '#555');
                ctx.fillStyle = mGrad; ctx.fillRect(-m.radius, -m.radius * 2, m.radius * 2, m.radius * 4);
                ctx.fillStyle = '#ff4400'; ctx.beginPath(); ctx.moveTo(-m.radius, m.radius * 2); ctx.lineTo(m.radius, m.radius * 2); ctx.lineTo(0, m.radius * 2 + Math.random() * 12 + 6); ctx.fill();
                ctx.restore();
            });

            items.forEach(item => {
                let iGrad = ctx.createRadialGradient(item.x - item.radius*0.3, item.y - item.radius*0.3, 0, item.x, item.y, item.radius);
                iGrad.addColorStop(0, '#fff'); iGrad.addColorStop(0.2, item.color); iGrad.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = iGrad; ctx.shadowColor = item.color; ctx.shadowBlur = 15; ctx.beginPath(); ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 0; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(item.label, item.x, item.y + 1);
            });

            enemies.forEach(e => {
                ctx.fillStyle = 'rgba(255, 100, 0, 0.7)'; ctx.beginPath(); ctx.moveTo(e.x - e.radius*0.3, e.y); ctx.lineTo(e.x + e.radius*0.3, e.y); ctx.lineTo(e.x, e.y - e.radius - Math.random() * 10 - 5); ctx.fill();
                let eGrad = ctx.createRadialGradient(e.x - e.radius*0.3, e.y + e.radius*0.3, e.radius*0.1, e.x, e.y, e.radius);
                eGrad.addColorStop(0, '#fff'); eGrad.addColorStop(0.3, e.color); eGrad.addColorStop(1, '#222');
                ctx.fillStyle = eGrad; ctx.beginPath();
                if (e.type === 'shooter') { for (let i = 0; i < 6; i++) { let angle = (i * Math.PI) / 3, x = e.x + e.radius * Math.cos(angle), y = e.y + e.radius * Math.sin(angle); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } } 
                else if (e.hp > 1) { for (let i = 0; i < 6; i++) { let angle = (i * Math.PI) / 3 + frameCount * 0.05, x = e.x + e.radius * Math.cos(angle), y = e.y + e.radius * Math.sin(angle); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } } 
                else { ctx.moveTo(e.x, e.y - e.radius); ctx.lineTo(e.x + e.radius, e.y); ctx.lineTo(e.x, e.y + e.radius); ctx.lineTo(e.x - e.radius, e.y); }
                ctx.closePath(); ctx.fill();
                ctx.fillStyle = e.type === 'shooter' ? '#fff' : 'rgba(255, 255, 255, 0.5)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.radius * 0.3, 0, Math.PI * 2); ctx.fill();
            });

            if (gameState !== 'GAMEOVER') {
                ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.moveTo(player.x - 6, player.y + player.radius * 0.5); ctx.lineTo(player.x + 6, player.y + player.radius * 0.5); ctx.lineTo(player.x, player.y + player.radius + 15 + Math.random() * 15); ctx.fill();
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(player.x - 3, player.y + player.radius * 0.5); ctx.lineTo(player.x + 3, player.y + player.radius * 0.5); ctx.lineTo(player.x, player.y + player.radius + 5 + Math.random() * 8); ctx.fill();
                if (player.hasShield) { ctx.strokeStyle = 'rgba(50, 255, 50, 0.7)'; ctx.lineWidth = 3; ctx.shadowColor = '#0f0'; ctx.shadowBlur = 15; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 1.8, 0, Math.PI * 2); ctx.stroke(); ctx.shadowBlur = 0; }
                if (player.speedBoostTimer > 0) { ctx.strokeStyle = 'rgba(50, 150, 255, 0.7)'; ctx.lineWidth = 2; ctx.shadowColor = '#08f'; ctx.shadowBlur = 10; ctx.beginPath(); ctx.globalAlpha = player.speedBoostTimer < 120 ? (Math.sin(frameCount * 0.3) * 0.5 + 0.5) : 1.0; ctx.arc(player.x, player.y, player.radius * 1.5, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1.0; ctx.shadowBlur = 0; }
                if (isPlayerImgLoaded) { const imgSize = player.radius * 3.5; ctx.shadowColor = player.color; ctx.shadowBlur = 10; ctx.drawImage(playerImg, player.x - imgSize / 2, player.y - imgSize / 2, imgSize, imgSize); ctx.shadowBlur = 0; } 
                else { ctx.fillStyle = player.color; ctx.shadowColor = player.color; ctx.shadowBlur = 15; ctx.beginPath(); ctx.moveTo(player.x, player.y - player.radius * 1.5); ctx.lineTo(player.x + player.radius, player.y + player.radius); ctx.lineTo(player.x, player.y + player.radius * 0.3); ctx.lineTo(player.x - player.radius, player.y + player.radius); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#ff8800'; ctx.shadowBlur = 5; ctx.beginPath(); ctx.moveTo(player.x - 5, player.y + player.radius * 0.5); ctx.lineTo(player.x + 5, player.y + player.radius * 0.5); ctx.lineTo(player.x, player.y + player.radius + Math.random() * 15 + 5); ctx.closePath(); ctx.fill(); }
                ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(player.x, player.y, 3, 0, Math.PI * 2); ctx.fill();
            }
        }

        if (gameState === 'INIT') {
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '16px sans-serif'; ctx.fillText('画面をクリックして開始', canvas.width / 2, canvas.height / 2);
            ctx.fillStyle = '#888'; ctx.font = '12px sans-serif'; ctx.fillText('(音声が再生されます)', canvas.width / 2, canvas.height / 2 + 30);
        } else if (gameState === 'START') {
            const time = Date.now();
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.15)'; ctx.lineWidth = 1; let offset = (time / 20) % 30;
            for(let i = -30; i < canvas.height; i += 30) { ctx.beginPath(); ctx.moveTo(0, i + offset); ctx.lineTo(canvas.width, i + offset); ctx.stroke(); }

            let blur = 15 + Math.sin(time / 150) * 10; ctx.shadowColor = '#0ff'; ctx.shadowBlur = blur; ctx.fillStyle = '#eef'; ctx.textAlign = 'center';
            ctx.font = 'italic bold 28px "Segoe UI", sans-serif';
            ctx.fillText('防衛戦線', canvas.width / 2, canvas.height / 2 - 110);
            ctx.font = 'italic bold 36px "Segoe UI", sans-serif';
            ctx.fillText('ネオンシューター', canvas.width / 2, canvas.height / 2 - 70); ctx.shadowBlur = 0;

            let btnX = canvas.width / 2 - 100, btn1Y = canvas.height / 2 + 10, btn2Y = canvas.height / 2 + 60, btnW = 200, btnH = 40;
            ctx.fillStyle = 'rgba(0, 255, 255, 0.15)'; ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.fillRect(btnX, btn1Y, btnW, btnH); ctx.strokeRect(btnX, btn1Y, btnW, btnH);
            ctx.fillStyle = '#0ff'; ctx.font = 'bold 16px sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText('START (通常モード)', canvas.width / 2, btn1Y + btnH / 2);

            ctx.fillStyle = 'rgba(255, 0, 255, 0.1)'; ctx.strokeStyle = '#f0f'; ctx.fillRect(btnX, btn2Y, btnW, btnH); ctx.strokeRect(btnX, btn2Y, btnW, btnH);
            ctx.fillStyle = '#f0f'; ctx.fillText('DEVELOPER MODE', canvas.width / 2, btn2Y + btnH / 2);

            let itemStartY = canvas.height / 2 + 160;
            ctx.fillStyle = 'rgba(0, 255, 255, 0.7)'; ctx.font = 'bold 12px sans-serif'; ctx.textBaseline = 'alphabetic'; ctx.fillText('▼ ITEM BOX ▼', canvas.width / 2, itemStartY - 30);
            const drawItemIcon = (baseX, y, color, label, desc) => {
                ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(baseX, y, 12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.shadowBlur = 0; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(label, baseX, y + 1);
                ctx.textAlign = 'left'; ctx.fillStyle = '#ddd'; ctx.font = '14px sans-serif'; ctx.fillText(desc, baseX + 20, y);
            };
            drawItemIcon(canvas.width / 2 - 85, itemStartY, '#ff3333', 'P', '弾数増加'); drawItemIcon(canvas.width / 2 + 25, itemStartY, '#3388ff', 'S', '連射UP');
            drawItemIcon(canvas.width / 2 - 85, itemStartY + 35, '#ff8800', 'M', 'ミサイル'); drawItemIcon(canvas.width / 2 + 25, itemStartY + 35, '#33ff33', 'D', 'シールド');
            ctx.textBaseline = 'alphabetic';
        } else if (gameState === 'GAMEOVER') {
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#f00'; ctx.textAlign = 'center'; ctx.font = 'bold 32px sans-serif'; ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);
            ctx.fillStyle = '#fff'; ctx.font = '18px sans-serif'; ctx.fillText(`最終スコア: ${score}`, canvas.width / 2, canvas.height / 2);
            let btnX = canvas.width / 2 - 80, btnW = 160, btnH = 40;
            ctx.fillStyle = 'rgba(0, 255, 255, 0.15)'; ctx.strokeStyle = '#0ff'; ctx.lineWidth = 2; ctx.fillRect(btnX, canvas.height / 2 + 40, btnW, btnH); ctx.strokeRect(btnX, canvas.height / 2 + 40, btnW, btnH);
            ctx.fillStyle = '#0ff'; ctx.font = 'bold 16px sans-serif'; ctx.textBaseline = 'middle'; ctx.fillText('リトライ', canvas.width / 2, canvas.height / 2 + 60);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; ctx.strokeStyle = '#fff'; ctx.fillRect(btnX, canvas.height / 2 + 100, btnW, btnH); ctx.strokeRect(btnX, canvas.height / 2 + 100, btnW, btnH);
            ctx.fillStyle = '#fff'; ctx.fillText('タイトルへ', canvas.width / 2, canvas.height / 2 + 120);
            ctx.textBaseline = 'alphabetic';
        }
    }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    resetGame();
    gameLoop();

</script>
